name: RetailPRED CI

on:
  push:
    branches: [main, v2-rebuild]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend-tests:
    name: Backend tests (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install pip==25.3
          pip install -r requirements-dev.lock

      - name: Run Milestone 1 temporal-integrity tests
        working-directory: .
        run: pytest -v tests/v2

      - name: Run data-platform contract tests
        working-directory: .
        run: pytest -v tests/platform

      - name: Run remaining Python test suite
        working-directory: .   # pytest.ini selects tests/
        run: pytest -v --ignore=tests/v2 --ignore=tests/platform

      - name: Audit recruiter-facing publication surface
        run: python scripts/audit_publication.py

  frontend-checks:
    name: Frontend checks (Node 24 LTS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint:publication && npm run lint

      - name: Build
        run: npm run build

  warehouse-parse:
    name: Warehouse manifest (dbt)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: warehouse/requirements.txt

      - name: Install dbt adapter
        run: pip install -r warehouse/requirements.txt

      - name: Parse warehouse project
        run: dbt parse --project-dir warehouse --profiles-dir warehouse

  container-smoke:
    name: Container smoke test (v2 API image)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build v2 API image
        run: docker build -t retailpred-v2-api:ci .

      - name: Start container
        run: docker run -d --name retailpred-v2-api -p 8000:8000 retailpred-v2-api:ci

      - name: Wait for /api/v2/health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/api/v2/health > /dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::Container did not become healthy"
          docker logs retailpred-v2-api
          exit 1

      - name: Assert fail-closed serving contract
        run: |
          set -euo pipefail
          health=$(curl -fsS http://localhost:8000/api/v2/health)
          echo "$health" | grep -q '"status":"restricted"'
          echo "$health" | grep -q '"service":{"status":"healthy"}'

          demo=$(curl -fsS http://localhost:8000/api/v2/demo-catalog)
          series=$(printf '%s' "$demo" | python3 -c 'import json,sys; print(json.load(sys.stdin)["fixtures"][0]["series_id"])')
          origin=$(printf '%s' "$demo" | python3 -c 'import json,sys; print(json.load(sys.stdin)["fixtures"][0]["forecast_origin"])')

          code=$(curl -s -o /tmp/forecast-production.json -w '%{http_code}' -X POST http://localhost:8000/api/v2/forecasts \
            -H 'Content-Type: application/json' \
            -d "{\"dataset\":\"m5\",\"series_id\":\"$series\",\"forecast_origin\":\"$origin\",\"horizon\":4,\"mode\":\"production\",\"freshness_requirement\":\"current\"}")
          test "$code" = "409"
          grep -q 'production_model_unavailable' /tmp/forecast-production.json

          code=$(curl -s -o /tmp/forecast-demo.json -w '%{http_code}' -X POST http://localhost:8000/api/v2/forecasts \
            -H 'Content-Type: application/json' \
            -d "{\"dataset\":\"m5\",\"series_id\":\"$series\",\"forecast_origin\":\"$origin\",\"horizon\":4,\"mode\":\"offline_demo\",\"freshness_requirement\":\"historical_allowed\"}")
          test "$code" = "200"
          grep -q '"is_demo":true' /tmp/forecast-demo.json

      - name: Stop container
        if: always()
        run: docker rm -f retailpred-v2-api
