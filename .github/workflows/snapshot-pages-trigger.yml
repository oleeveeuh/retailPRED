name: Redeploy Pages on live-data update

# The Databricks publisher commits v2-latest.json, the 2.2-status record,
# and the runs.jsonl log to the machine-written live-data branch; this
# workflow forwards any of those changes to the Pages deploy. Status-only
# runs (refusal runs that publish no snapshot) redeploy the site too, so
# the pipeline card stays current.

on:
  push:
    branches: [live-data]
    paths:
      - 'live/v2-latest.json'
      - 'live/v2-ingest-status.json'
      - 'live/runs.jsonl'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  trigger-pages-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Pages deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages-deploy.yml --ref main --repo "$GITHUB_REPOSITORY"
