name: Build and Push Docker Image

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: retailpred-api
  DOCKERFILE: ./Dockerfile

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    # Image target: Docker Hub when DOCKER_USERNAME/DOCKER_PASSWORD secrets are
    # configured, otherwise a local build used only for validation (no push).
    env:
      REGISTRY_IMAGE: ${{ secrets.DOCKER_USERNAME != '' && format('{0}/retailpred-api', secrets.DOCKER_USERNAME) || 'retailpred-api' }}
      HAS_DOCKERHUB_CREDS: ${{ secrets.DOCKER_USERNAME != '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: env.HAS_DOCKERHUB_CREDS == 'true' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          push: ${{ env.HAS_DOCKERHUB_CREDS == 'true' && github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        if: success() && env.HAS_DOCKERHUB_CREDS == 'true' && github.event_name != 'pull_request'
        with:
          image-ref: ${{ env.REGISTRY_IMAGE }}:latest
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: success() && env.HAS_DOCKERHUB_CREDS == 'true' && github.event_name != 'pull_request'
        with:
          sarif_file: 'trivy-results.sarif'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    env:
      HAS_DOCKERHUB_CREDS: ${{ secrets.DOCKER_USERNAME != '' }}

    steps:
      - name: Skip (no Docker Hub credentials configured)
        if: env.HAS_DOCKERHUB_CREDS != 'true'
        run: echo "DOCKER_USERNAME/DOCKER_PASSWORD secrets not set — nothing to deploy."

      - name: Checkout code
        if: env.HAS_DOCKERHUB_CREDS == 'true'
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        if: env.HAS_DOCKERHUB_CREDS == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: env.HAS_DOCKERHUB_CREDS == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Add your deployment steps here
      # Example: Deploy to AWS ECS, Google Cloud Run, etc.

      - name: Deploy notification
        if: env.HAS_DOCKERHUB_CREDS == 'true'
        run: |
          echo "Docker image built and pushed successfully!"
          echo "Image: ${{ secrets.DOCKER_USERNAME }}/retailpred-api:latest"
          echo "Deploy to your cloud platform using the deployment guide in DEPLOYMENT.md"
