services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: retailpred-backend
    ports:
      - "8000:8000"
    volumes:
      # SQLite database - the backend resolves it at <repo>/data/retailpred.db,
      # mapped to /data inside the container
      - ./data:/data
      # Trained serving models (flat layout read by the inference modules)
      - ./backend/ml/models:/app/ml/models
      # Feature CSVs used to build inference features
      - ./project_root/data_multi_resolution:/project_root/data_multi_resolution:ro
      # Legacy/auxiliary training outputs
      - ./training_outputs:/training_outputs
    environment:
      - LOG_LEVEL=INFO
    networks:
      - retailpred-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:8000
    container_name: retailpred-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    environment:
      - NGINX_HOST=localhost
      - NGINX_PORT=80
    networks:
      - retailpred-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

networks:
  retailpred-network:
    driver: bridge
