services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: retailpred-backend
    ports:
      - "8000:8000"
    environment:
      - LOG_LEVEL=INFO
      - RETAILPRED_ENABLE_LEGACY_API=false
    networks:
      - retailpred-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v2/health', timeout=3)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_DEMO_MODE=false
        - VITE_API_URL=
    container_name: retailpred-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    environment:
      - NGINX_HOST=localhost
      - NGINX_PORT=80
    networks:
      - retailpred-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

networks:
  retailpred-network:
    driver: bridge
