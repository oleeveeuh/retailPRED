retailpred_warehouse:
  target: dev
  outputs:
    dev:
      type: databricks
      catalog: "{{ env_var('DATABRICKS_CATALOG', 'retailpred') }}"
      schema: dbt_dev
      host: "{{ env_var('DATABRICKS_HOST', 'https://example.cloud.databricks.com') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH', '/sql/1.0/warehouses/placeholder') }}"
      token: "{{ env_var('DATABRICKS_TOKEN', 'placeholder') }}"
      threads: 4
