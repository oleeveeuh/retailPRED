resources:
  jobs:
    platform_bootstrap:
      name: retailpred-platform-bootstrap
      tasks:
        - task_key: create_declared_delta_tables
          spark_python_task:
            python_file: ../jobs/bootstrap_tables.py
            parameters:
              - --catalog
              - ${var.catalog}
          environment_key: serverless_default
      environments:
        - environment_key: serverless_default
          spec:
            environment_version: '2'
