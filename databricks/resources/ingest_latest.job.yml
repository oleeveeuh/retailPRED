resources:
  jobs:
    platform_ingest_latest:
      name: retailpred-platform-ingest-latest
      # Declared paused: unpause after the census-api-key and
      # github-publisher-token secrets are configured in the secret scope.
      # Task graph: ingest -> score -> realized errors -> publish snapshot.
      # Scoring fails closed while the portfolio candidate is unauthorized;
      # is_live stays false until the recurring schedule has executed.
      schedule:
        quartz_cron_expression: "0 30 14 * * ?"
        timezone_id: "America/New_York"
        pause_status: PAUSED
      tasks:
        - task_key: pull_latest_census_release
          spark_python_task:
            python_file: ../jobs/ingest_latest.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --secret-scope
              - ${var.secret_scope}
              - --repo-root
              - ${workspace.file_path}
          environment_key: serverless_default
        - task_key: score_promoted_model
          depends_on:
            - task_key: pull_latest_census_release
          spark_python_task:
            python_file: ../jobs/score_latest.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --repo-root
              - ${workspace.file_path}
          environment_key: serverless_default
        - task_key: evaluate_realized_errors
          depends_on:
            - task_key: pull_latest_census_release
            - task_key: score_promoted_model
          spark_python_task:
            python_file: ../jobs/realized_errors.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --repo-root
              - ${workspace.file_path}
          environment_key: serverless_default
        - task_key: publish_snapshot_github
          depends_on:
            - task_key: evaluate_realized_errors
          spark_python_task:
            python_file: ../jobs/publish_github_snapshot.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --secret-scope
              - ${var.secret_scope}
              - --repo-root
              - ${workspace.file_path}
              # Job-identity macros for the 2.2-status record; the publish
              # task records an unresolved macro as null, never as text.
              - --job-id
              - "{{job.id}}"
              - --job-run-id
              - "{{job.run_id}}"
              - --pipeline-started-at-ms
              - "{{start_time}}"
          environment_key: serverless_default
      environments:
        - environment_key: serverless_default
          spec:
            environment_version: '2'
            dependencies:
              - pydantic>=2
              - lightgbm>=4.0
