resources:
  jobs:
    platform_ingest_latest:
      name: retailpred-platform-ingest-latest
      # Declared paused: unpause after the census-api-key secret is configured
      # in the secret scope. The job itself fails closed when scoring is not
      # authorized by the frozen portfolio. Serverless compute only: Free
      # Edition exposes no classic clusters to reference.
      schedule:
        quartz_cron_expression: "0 30 14 * * ?"
        timezone_id: "America/New_York"
        pause_status: PAUSED
      tasks:
        - task_key: pull_latest_census_release
          spark_python_task:
            python_file: ../jobs/ingest_latest.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --secret-scope
              - ${var.secret_scope}
          environment_key: serverless_default
        - task_key: score_realized_errors
          depends_on:
            - task_key: pull_latest_census_release
          spark_python_task:
            python_file: ../jobs/realized_errors.py
            parameters:
              - --catalog
              - ${var.catalog}
          environment_key: serverless_default
      environments:
        - environment_key: serverless_default
          spec:
            environment_version: '2'
