bundle:
  name: retailpred

include:
  - databricks/resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog for RetailPRED tables. Free Edition workspaces use the pre-provisioned "workspace" catalog; named catalogs require a paid workspace.
    default: workspace
  secret_scope:
    description: Secret scope holding census-api-key for the live ingest job.
    default: retailpred
  staged_root:
    description: Volume path containing staged local-store Parquet for the sync job.
    default: "/Volumes/workspace/default/retailpred_staging"

targets:
  dev:
    default: true
    mode: development
  prod:
    mode: production
