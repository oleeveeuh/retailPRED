bundle:
  name: retailpred

include:
  - databricks/resources/*.yml

variables:
  cluster_id:
    description: Existing Databricks cluster ID used by the bootstrap task.
  catalog:
    description: Unity Catalog catalog for RetailPRED tables.
    default: retailpred
  secret_scope:
    description: Secret scope holding census-api-key for the live ingest job.
    default: retailpred

targets:
  dev:
    default: true
    mode: development
  prod:
    mode: production
